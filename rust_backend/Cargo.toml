[package]
name = "mlrc-accs-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Transport and watcher core for the MLRC ACCS streaming prototype"
license = "MIT"

[lib]
name = "mlrc_accs_backend"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
usb = ["dep:rusb"]

[dependencies]
rusb = { version = "0.9.4", optional = true }
